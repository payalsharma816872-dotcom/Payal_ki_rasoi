<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Payal Ki Rasoi</title>

<link rel="stylesheet" href="css/style.css">

<style>

.gallery{
padding:120px 8% 80px;
}

.gallery h1{
text-align:center;
font-size:45px;
color:#ff5e00;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.grid img{
width:100%;
height:250px;
object-fit:cover;
border-radius:20px;
cursor:pointer;
transition:.4s;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.grid img:hover{
transform:scale(1.05);
}

.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:9999;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:20px;
}

.close{
position:absolute;
top:30px;
right:40px;
font-size:45px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<div class="logo">🍲 Payal Ki Rasoi</div>

<nav>
<a href="index.html">Home</a>
<a href="recipes.html">Recipes</a>
<a href="gallery.html">Gallery</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<section class="gallery">

<h1>Recipe Gallery</h1>

<div class="grid">

<img src="images/recipe1.jpg" onclick="openImage(this.src)">
<img src="images/recipe2.jpg" onclick="openImage(this.src)">
<img src="images/recipe3.jpg" onclick="openImage(this.src)">
<img src="images/recipe4.jpg" onclick="openImage(this.src)">
<img src="images/recipe5.jpg" onclick="openImage(this.src)">
<img src="images/recipe6.jpg" onclick="openImage(this.src)">

</div>

</section>

<div class="lightbox" id="lightbox">

<span class="close" onclick="closeImage()">&times;</span>

<img id="preview">

</div>

<footer>

<h3>Payal Ki Rasoi</h3>

<p>Fresh Homemade Indian Recipes ❤️</p>

</footer>

<script>

function openImage(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("preview").src=src;
}

function closeImage(){
document.getElementById("lightbox").style.display="none";
}

</script>

<script src="js/script.js"></script>

</body>
</html>
