<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff6b00,#ffb347);
font-family:Poppins,sans-serif;
}

.box{
background:#fff;
padding:50px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.2);
max-width:500px;
}

.box h1{
font-size:100px;
color:#ff6b00;
margin:0;
}

.box h2{
margin:15px 0;
}

.box p{
color:#666;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#ff6b00;
color:white;
text-decoration:none;
border-radius:40px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#e65100;
}

</style>

</head>

<body>

<div class="box">

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>
The page you're looking for doesn't exist or has been moved.
</p>

<a href="index.html" class="btn">
🏠 Back to Home
</a>

</div>

</body>
</html>
